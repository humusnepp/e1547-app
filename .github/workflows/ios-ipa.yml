name: build ios ipa

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          version: latest
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build unsigned archive
        run: flutter build ipa --release --no-codesign

      - name: Assemble unsigned IPA from archive
        run: |
          set -eux
          ARCHIVE="$(find build/ios/archive -name '*.xcarchive' -d 2>/dev/null | head -n1)"
          echo "archive: $ARCHIVE"
          mkdir -p build/ios/ipa/Payload
          cp -R "$ARCHIVE/Products/Applications/Runner.app" build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qr "$GITHUB_WORKSPACE/build/ios/e1547-app-ios-unsigned.ipa" Payload)
          ls -la build/ios/e1547-app-ios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: e1547-app-ios-unsigned
          path: |
            build/ios/e1547-app-ios-unsigned.ipa
          if-no-files-found: error
